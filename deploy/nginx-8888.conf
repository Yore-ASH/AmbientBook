# 可选的 nginx 反向代理：对外仍然是 8888，后端 gunicorn 只监听本机。
#
#   sudo cp deploy/nginx-8888.conf /etc/nginx/sites-available/tscp-web
#   sudo ln -s /etc/nginx/sites-available/tscp-web /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 同时要把 systemd 里的 --bind 改成 127.0.0.1:8000，
# 并在 /etc/tscp-web.env 里设 TSCP_PROXY_HOPS=1。

server {
    listen 8888;
    listen [::]:8888;
    server_name _;

    # 音频上传很占体积，默认的 1M 肯定不够
    client_max_body_size 512M;

    # 静态文件交给 nginx 直接发，省掉一层 Python
    location /static/ {
        alias /opt/tscp/webapp/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 打包大剧情包 + 传大音频都可能很慢
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_connect_timeout 15s;

        # 上传直接透传给后端，不要在 nginx 落盘缓冲
        proxy_request_buffering off;

        # 音频要走 Range 请求才能拖动进度条，不能关掉分块传输
        proxy_buffering off;
    }
}
