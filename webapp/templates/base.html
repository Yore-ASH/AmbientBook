<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TSCP 剧情工坊{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('pages.index') }}">TSCP 剧情工坊</a>
    <nav>
      {% if user %}
        <a href="{{ url_for('pages.index') }}">我的剧情</a>
        <a href="{{ url_for('pages.editor') }}">编写</a>
        <a href="{{ url_for('pages.player') }}">播放</a>
        {% if user.is_admin %}<a href="{{ url_for('pages.admin_page') }}">管理后台</a>{% endif %}
        <span class="who" title="{{ user.username }}">{{ user.display_name or user.username }}</span>
        <button id="logout" class="ghost" type="button">退出</button>
      {% else %}
        <a href="{{ url_for('pages.index') }}">登录 / 注册</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
